
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa Familiar | Familia Cuenca</title>

  <!-- Leaflet: librería para el mapa interactivo -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #243447;
      background: #f4f7fa;
    }

    /* Encabezado */
    .encabezado {
      padding: 22px 16px;
      text-align: center;
      background: #17365d;
      color: #ffffff;
    }

    .encabezado h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .encabezado p {
      margin: 0;
      font-size: 15px;
    }

    /* Botones de navegación */
    .navegacion {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      background: #ffffff;
      border-bottom: 1px solid #dce4ed;
    }

    .navegacion button,
    .navegacion a {
      display: inline-block;
      padding: 10px 15px;
      border: 1px solid #17365d;
      border-radius: 7px;
      background: #ffffff;
      color: #17365d;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    .navegacion button:hover,
    .navegacion a:hover {
      background: #17365d;
      color: #ffffff;
    }

   
/* Indicadores compactos */
.indicadores {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 16px;
}

.indicador {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 10px 12px;
  background: #ffffff;
  border: 1px solid #dce4ed;
  border-radius: 9px;
  box-shadow: 0 1px 4px rgba(23, 54, 93, 0.06);
}

.indicador-icono {
  font-size: 22px;
  flex-shrink: 0;
}

.indicador-titulo {
  display: block;
  color: #526273;
  font-size: 11px;
  line-height: 1.3;
}

.indicador strong {
  display: block;
  margin-top: 2px;
  color: #17365d;
  font-size: 23px;
  line-height: 1.1;
}


    /* Mapa */
    #mapa {
      width: calc(100% - 32px);
      height: 68vh;
      min-height: 380px;
      margin: 0 auto;
      background: #e5eaf0;
      border: 1px solid #dce4ed;
      border-radius: 10px;
      z-index: 1;
    }

    /* Ventanas de información */
    .popup-familiar {
      min-width: 190px;
      max-width: 280px;
    }

    .popup-familiar h3 {
      margin: 0 0 8px;
      color: #17365d;
      font-size: 16px;
    }

    .popup-familiar p {
      margin: 6px 0;
    }

    .popup-familiar ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }

    .popup-familiar li {
      margin-bottom: 5px;
    }

    .mensaje {
      max-width: 1200px;
      margin: 12px auto;
      padding: 0 16px;
      color: #526273;
      font-size: 13px;
      line-height: 1.5;
    }

    .pie {
      padding: 20px 12px;
      text-align: center;
      color: #526273;
      font-size: 13px;
    }

    /* Vista móvil: tres tarjetas en una sola fila */
@media (max-width: 650px) {
  .indicadores {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
    padding: 8px 10px;
  }

  .indicador {
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 8px 3px;
    min-height: 94px;
    text-align: center;
  }

  .indicador-icono {
    font-size: 20px;
  }

  .indicador-titulo {
    font-size: 10px;
    overflow-wrap: anywhere;
  }

  .indicador strong {
    font-size: 21px;
  }
}
      .navegacion {
        gap: 8px;
      }

      .navegacion button,
      .navegacion a {
        padding: 9px 11px;
        font-size: 13px;
      }

      #mapa {
        width: calc(100% - 24px);
        height: 65vh;
        min-height: 350px;
      }
    }
  </style>
</head>

<body>

  <header class="encabezado">
    <h1>Familia Cuenca</h1>
    <p>Mapa geográfico de nuestra familia</p>
  </header>

  <nav class="navegacion" aria-label="Controles del mapa">

    <button id="verMexico" type="button">
      🇲🇽 Ver México
    </button>

    <button id="verMundo" type="button">
      🌎 Ver mundo
    </button>

    <button id="acercar" type="button">
      ＋ Acercar
    </button>

    <button id="alejar" type="button">
      − Alejar
    </button>

    <a href="./index.html">
      ← Volver al portal
    </a>

  </nav>

  <main>

    <!-- Indicadores calculados desde familia.json -->
    <section
      class="indicadores"
      aria-label="Resumen del mapa familiar"
    >

      <article class="indicador">
        <span class="indicador-icono">👨‍👩‍👧‍👦</span>

        <div>
          <span class="indicador-titulo">
            Familiares registrados
          </span>

          <strong id="totalFamiliares">0</strong>
        </div>
      </article>

      <article class="indicador">
        <span class="indicador-icono">📍</span>

        <div>
          <span class="indicador-titulo">
            Familiares ubicados
          </span>

          <strong id="familiaresUbicados">0</strong>
        </div>
      </article>

      <article class="indicador">
        <span class="indicador-icono">🧭</span>

        <div>
          <span class="indicador-titulo">
            Pendientes de ubicación
          </span>

          <strong id="familiaresPendientes">0</strong>
        </div>
      </article>

    </section>

    <!-- Mapa interactivo -->
    <div
      id="mapa"
      role="application"
      aria-label="Mapa interactivo de las residencias de la Familia Cuenca"
    ></div>

    <p class="mensaje" id="estadoMapa" role="status">
      Cargando información familiar...
    </p>

  </main>

  <footer class="pie">
    Nuestra historia continúa · Familia Cuenca
  </footer>

  <!-- Librería Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // =====================================================
    // MAPA FAMILIAR CUENCA
    // Fuente: ./data/familia.json
    // Ubicación: residencia actual
    // =====================================================

    // Vista inicial centrada en México.
    const mapa = L.map("mapa").setView(
      [23.6345, -102.5528],
      5
    );

    // Mapa base de OpenStreetMap.
    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }
    ).addTo(mapa);

    // Referencias a los elementos de la página.
    const totalElemento =
      document.getElementById("totalFamiliares");

    const ubicadosElemento =
      document.getElementById("familiaresUbicados");

    const pendientesElemento =
      document.getElementById("familiaresPendientes");

    const estadoElemento =
      document.getElementById("estadoMapa");

    // Normalizar textos para comparar sin distinguir
    // mayúsculas, minúsculas ni acentos.
    function normalizar(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    // =====================================================
    // CATÁLOGO DE COORDENADAS
    // Coordenadas aproximadas de ciudades conocidas.
    // Las nuevas ubicaciones deberán incorporarse aquí.
    // =====================================================

    const ubicaciones = [
      {
        ciudad: "cdmx",
        estado: "cdmx",
        pais: "mexico",
        lat: 19.4326,
        lng: -99.1332,
        etiqueta: "Ciudad de México"
      },
      {
        ciudad: "satelite",
        estado: "estado de mexico",
        pais: "mexico",
        lat: 19.5100,
        lng: -99.2350,
        etiqueta: "Ciudad Satélite, Estado de México"
      },
      {
        ciudad: "playa del carmen",
        estado: "quintana roo",
        pais: "mexico",
        lat: 20.6296,
        lng: -87.0739,
        etiqueta: "Playa del Carmen, Quintana Roo"
      },
      {
        ciudad: "cancun",
        estado: "quintana roo",
        pais: "mexico",
        lat: 21.1619,
        lng: -86.8515,
        etiqueta: "Cancún, Quintana Roo"
      },
      {
        ciudad: "merida",
        estado: "yucatan",
        pais: "mexico",
        lat: 20.9674,
        lng: -89.5926,
        etiqueta: "Mérida, Yucatán"
      },
      {
        ciudad: "toluca",
        estado: "estado de mexico",
        pais: "mexico",
        lat: 19.2826,
        lng: -99.6557,
        etiqueta: "Toluca, Estado de México"
      },
      {
        ciudad: "los mochis",
        estado: "sinaloa",
        pais: "mexico",
        lat: 25.7905,
        lng: -108.9859,
        etiqueta: "Los Mochis, Sinaloa"
      },
      {
        ciudad: "oakland",
        estado: "california",
        pais: "usa",
        lat: 37.8044,
        lng: -122.2712,
        etiqueta: "Oakland, California, USA"
      },
      {
        ciudad: "el paso",
        estado: "texas",
        pais: "usa",
        lat: 31.7619,
        lng: -106.4850,
        etiqueta: "El Paso, Texas, USA"
      },
      {
        ciudad: "atenas",
        estado: "atenas",
        pais: "grecia",
        lat: 37.9838,
        lng: 23.7275,
        etiqueta: "Atenas, Grecia"
      }
    ];

    // Catálogo opcional para registros que solo tienen
    // una región conocida, sin ciudad.
    const regiones = [
      {
        estado: "lima",
        pais: "peru",
        lat: -12.0464,
        lng: -77.0428,
        etiqueta: "Lima, Perú"
      }
    ];

    // Buscar una ubicación reconocida.
    function obtenerUbicacion(persona) {
      const ciudad = normalizar(persona.ciudad);
      const estado = normalizar(persona.estado);
      const pais = normalizar(persona.pais);

      // Si hay ciudad, buscar coincidencia exacta
      // de ciudad, estado y país.
      if (ciudad) {
        const encontrada = ubicaciones.find(function (u) {
          return normalizar(u.ciudad) === ciudad &&
            normalizar(u.estado) === estado &&
            normalizar(u.pais) === pais;
        });

        if (encontrada) {
          return encontrada;
        }
      }

      // Si no hay ciudad, permitir una región
      // únicamente cuando exista una coincidencia conocida.
      if (!ciudad && estado && pais) {
        const region = regiones.find(function (u) {
          return normalizar(u.estado) === estado &&
            normalizar(u.pais) === pais;
        });

        if (region) {
          return region;
        }
      }

      // No inventar coordenadas.
      return null;
    }

    // Crear una clave para agrupar familiares
    // que comparten la misma ubicación.
    function claveUbicacion(u) {
      return [
        normalizar(u.etiqueta),
        u.lat,
        u.lng
      ].join("|");
    }

    // =====================================================
    // CARGA DE FAMILIA.JSON
    // =====================================================

    async function cargarFamiliares() {
      try {
        estadoElemento.textContent =
          "Cargando información familiar...";

        const respuesta = await fetch(
          "./data/familia.json",
          { cache: "no-store" }
        );

        if (!respuesta.ok) {
          throw new Error(
            "No se pudo leer data/familia.json. Código: " +
            respuesta.status
          );
        }

        const familiares = await respuesta.json();

        if (!Array.isArray(familiares)) {
          throw new Error(
            "El contenido de familia.json no es un arreglo."
          );
        }

        // Crear grupos de personas por ubicación.
        const grupos = new Map();

        familiares.forEach(function (persona) {
          const ubicacion = obtenerUbicacion(persona);

          if (!ubicacion) {
            return;
          }

          const clave = claveUbicacion(ubicacion);

          if (!grupos.has(clave)) {
            grupos.set(clave, {
              ubicacion: ubicacion,
              personas: []
            });
          }

          grupos.get(clave).personas.push(persona);
        });

        // Calcular familiares ubicados.
        let totalUbicados = 0;

        grupos.forEach(function (grupo) {
          totalUbicados += grupo.personas.length;
        });

        // Actualizar los tres indicadores.
        totalElemento.textContent = familiares.length;

        ubicadosElemento.textContent = totalUbicados;

        pendientesElemento.textContent =
          familiares.length - totalUbicados;

        // =================================================
        // DIBUJAR MARCADORES Y VENTANAS INFORMATIVAS
        // =================================================

        grupos.forEach(function (grupo) {
          const u = grupo.ubicacion;
          const personas = grupo.personas;

          const marcador = L.marker([u.lat, u.lng])
            .addTo(mapa);

          // Construir el contenido como elementos de texto
          // para evitar interpretar nombres como código HTML.
          const contenido = document.createElement("div");
          contenido.className = "popup-familiar";

          const titulo = document.createElement("h3");
          titulo.textContent = u.etiqueta;
          contenido.appendChild(titulo);

          const total = document.createElement("p");
          total.textContent =
            personas.length +
            (
              personas.length === 1
                ? " familiar registrado"
                : " familiares registrados"
            );

          contenido.appendChild(total);

          const lista = document.createElement("ul");

          personas.forEach(function (persona) {
            const elemento = document.createElement("li");

            elemento.textContent =
              String(persona.nombre || "Nombre no disponible");

            lista.appendChild(elemento);
          });

          contenido.appendChild(lista);

          marcador.bindPopup(contenido);
        });

        estadoElemento.textContent =
          "Información cargada. Se muestran " +
          totalUbicados +
          " familiares en " +
          grupos.size +
          " ubicaciones reconocidas.";

        console.log(
          "Familiares registrados:",
          familiares.length,
          "| Familiares ubicados:",
          totalUbicados,
          "| Pendientes:",
          familiares.length - totalUbicados,
          "| Ubicaciones:",
          grupos.size
        );

      } catch (error) {
        console.error(
          "Error al cargar la información familiar:",
          error
        );

        estadoElemento.textContent =
          "No fue posible cargar la información familiar. " +
          "Verifica la ruta de familia.json y vuelve a intentarlo.";
      }
    }

    // =====================================================
    // CONTROLES DE NAVEGACIÓN
    // =====================================================

    document.getElementById("verMexico")
      .addEventListener("click", function () {
        mapa.setView([23.6345, -102.5528], 5);
      });

    document.getElementById("verMundo")
      .addEventListener("click", function () {
        mapa.setView([20, 0], 2);
      });

    document.getElementById("acercar")
      .addEventListener("click", function () {
        mapa.zoomIn();
      });

    document.getElementById("alejar")
      .addEventListener("click", function () {
        mapa.zoomOut();
      });

    // Iniciar la carga de datos.
    cargarFamiliares();
  </script>

</body>
</html>
