
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa Familiar | Familia Cuenca</title>

  <!-- Librería del mapa -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #243447;
      background: #f4f7fa;
    }

    .encabezado {
      padding: 20px;
      text-align: center;
      background: #17365d;
      color: white;
    }

    .encabezado h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .encabezado p {
      margin: 0;
      font-size: 15px;
    }

    .navegacion {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: white;
    }

    .navegacion button,
    .navegacion a {
      padding: 10px 15px;
      border: 1px solid #17365d;
      border-radius: 6px;
      background: white;
      color: #17365d;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    .navegacion button:hover,
    .navegacion a:hover {
      background: #17365d;
      color: white;
    }

    #mapa {
      width: 100%;
      height: 68vh;
      min-height: 380px;
      background: #e5eaf0;
    }

    .pie {
      padding: 14px;
      text-align: center;
      font-size: 13px;
      color: #526273;
    }

    @media (max-width: 600px) {
      .encabezado h1 {
        font-size: 22px;
      }

      #mapa {
        height: 65vh;
        min-height: 350px;
      }
    }
  </style>
</head>

<body>

  <header class="encabezado">
    <h1>Familia Cuenca</h1>
    <p>Mapa geográfico de nuestra familia</p>
  </header>

  <nav class="navegacion">
    <button id="verMexico" type="button">
      🇲🇽 Ver México
    </button>

    <button id="verMundo" type="button">
      🌎 Ver mundo
    </button>

    <button id="acercar" type="button">
      ＋ Acercar
    </button>

    <button id="alejar" type="button">
      − Alejar
    </button>

    <a href="./index.html">
      ← Volver al portal
    </a>
  </nav>

  <main>
    <div id="mapa" aria-label="Mapa interactivo de la familia"></div>

    <div class="pie">
      Nuestra historia continúa · Familia Cuenca
    </div>
  </main>

  <!-- Librería interactiva -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Crear el mapa centrado inicialmente en México.
    const mapa = L.map("mapa").setView(
      [23.6345, -102.5528],
      5
    );

    // Mapa base de OpenStreetMap.
    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }
    ).addTo(mapa);

    // Regresar a la vista inicial de México.
    document.getElementById("verMexico").addEventListener(
      "click",
      function () {
        mapa.setView([23.6345, -102.5528], 5);
      }
    );

    // Mostrar una vista mundial para navegar a otros países.
    document.getElementById("verMundo").addEventListener(
      "click",
      function () {
        mapa.setView([20, 0], 2);
      }
    );

    // Controles adicionales de acercamiento y alejamiento.
    document.getElementById("acercar").addEventListener(
      "click",
      function () {
        mapa.zoomIn();
      }
    );

    document.getElementById("alejar").addEventListener(
      "click",
      function () {
        mapa.zoomOut();
      }
    );
  </script>

</body>
</html>
