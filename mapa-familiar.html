
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa Familiar | Familia Cuenca</title>

  <!-- Librería del mapa -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #243447;
      background: #f4f7fa;
    }

    .encabezado {
      padding: 20px;
      text-align: center;
      background: #17365d;
      color: white;
    }

    .encabezado h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .encabezado p {
      margin: 0;
      font-size: 15px;
    }

    .navegacion {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: white;
    }

    .navegacion button,
    .navegacion a {
      padding: 10px 15px;
      border: 1px solid #17365d;
      border-radius: 6px;
      background: white;
      color: #17365d;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    .navegacion button:hover,
    .navegacion a:hover {
      background: #17365d;
      color: white;
    }

    #mapa {
      width: 100%;
      height: 68vh;
      min-height: 380px;
      background: #e5eaf0;
    }

    .pie {
      padding: 14px;
      text-align: center;
      font-size: 13px;
      color: #526273;
    }

    @media (max-width: 600px) {
      .encabezado h1 {
        font-size: 22px;
      }

      #mapa {
        height: 65vh;
        min-height: 350px;
      }
    }
  </style>
</head>

<body>

  <header class="encabezado">
    <h1>Familia Cuenca</h1>
    <p>Mapa geográfico de nuestra familia</p>
  </header>

  <nav class="navegacion">
    <button id="verMexico" type="button">
      🇲🇽 Ver México
    </button>

    <button id="verMundo" type="button">
      🌎 Ver mundo
    </button>

    <button id="acercar" type="button">
      ＋ Acercar
    </button>

    <button id="alejar" type="button">
      − Alejar
    </button>

    <a href="./index.html">
      ← Volver al portal
    </a>
  </nav>

  <main>
    <div id="mapa" aria-label="Mapa interactivo de la familia"></div>

    <div class="pie">
      Nuestra historia continúa · Familia Cuenca
    </div>
  </main>

  <!-- Librería interactiva -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>
  // =====================================================
  // MAPA FAMILIAR CUENCA
  // Fuente: data/familia.json
  // Ubicación: residencia actual
  // =====================================================

  const mapa = L.map("mapa").setView(
    [23.6345, -102.5528],
    5
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
  ).addTo(mapa);

  // Normalizar textos para comparar ciudades y países.
  function normalizar(valor) {
    return String(valor || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLowerCase();
  }

  // Coordenadas aproximadas de ubicaciones conocidas.
  // No se asignan coordenadas a ubicaciones desconocidas.
  const ubicaciones = [
    {
      ciudad: "cdmx",
      estado: "cdmx",
      pais: "mexico",
      lat: 19.4326,
      lng: -99.1332,
      etiqueta: "Ciudad de México"
    },
    {
      ciudad: "satelite",
      estado: "estado de mexico",
      pais: "mexico",
      lat: 19.5100,
      lng: -99.2350,
      etiqueta: "Ciudad Satélite, Estado de México"
    },
    {
      ciudad: "toluca",
      estado: "estado de mexico",
      pais: "mexico",
      lat: 19.2826,
      lng: -99.6557,
      etiqueta: "Toluca, Estado de México"
    },
    {
      ciudad: "merida",
      estado: "yucatan",
      pais: "mexico",
      lat: 20.9674,
      lng: -89.5926,
      etiqueta: "Mérida, Yucatán"
    },
    {
      ciudad: "playa del carmen",
      estado: "quintana roo",
      pais: "mexico",
      lat: 20.6296,
      lng: -87.0739,
      etiqueta: "Playa del Carmen, Quintana Roo"
    },
    {
      ciudad: "cancun",
      estado: "quintana roo",
      pais: "mexico",
      lat: 21.1619,
      lng: -86.8515,
      etiqueta: "Cancún, Quintana Roo"
    },
    {
      ciudad: "los mochis",
      estado: "sinaloa",
      pais: "mexico",
      lat: 25.7905,
      lng: -108.9859,
      etiqueta: "Los Mochis, Sinaloa"
    },
    {
      ciudad: "oakland",
      estado: "california",
      pais: "usa",
      lat: 37.8044,
      lng: -122.2712,
      etiqueta: "Oakland, California, USA"
    },
    {
      ciudad: "el paso",
      estado: "texas",
      pais: "usa",
      lat: 31.7619,
      lng: -106.4850,
      etiqueta: "El Paso, Texas, USA"
    },
    {
      ciudad: "atenas",
      estado: "atenas",
      pais: "grecia",
      lat: 37.9838,
      lng: 23.7275,
      etiqueta: "Atenas, Grecia"
    }
  ];

  // Ubicaciones conocidas cuando solo hay estado o región.
  const regiones = [
    {
      estado: "lima",
      pais: "peru",
      lat: -12.0464,
      lng: -77.0428,
      etiqueta: "Lima, Perú"
    }
  ];

  function obtenerUbicacion(persona) {
    const ciudad = normalizar(persona.ciudad);
    const estado = normalizar(persona.estado);
    const pais = normalizar(persona.pais);

    if (ciudad) {
      const encontrada = ubicaciones.find(function (u) {
        return normalizar(u.ciudad) === ciudad &&
          normalizar(u.estado) === estado &&
          normalizar(u.pais) === pais;
      });

      if (encontrada) return encontrada;
    }

    // Si no hay ciudad, usar solo una región conocida.
    if (!ciudad && estado && pais) {
      const region = regiones.find(function (u) {
        return normalizar(u.estado) === estado &&
          normalizar(u.pais) === pais;
      });

      if (region) return region;
    }

    return null;
  }

  // Agrupar familiares que comparten la misma ubicación.
  function claveUbicacion(u) {
    return [
      normalizar(u.etiqueta),
      u.lat,
      u.lng
    ].join("|");
  }

  async function cargarFamiliares() {
    try {
      const respuesta = await fetch("./data/familia.json", {
        cache: "no-store"
      });

      if (!respuesta.ok) {
        throw new Error("No se pudo leer familia.json");
      }

      const familiares = await respuesta.json();

      const grupos = new Map();

      familiares.forEach(function (persona) {
        const ubicacion = obtenerUbicacion(persona);

        // Sin ubicación conocida, no inventar un marcador.
        if (!ubicacion) return;

        const clave = claveUbicacion(ubicacion);

        if (!grupos.has(clave)) {
          grupos.set(clave, {
            ubicacion: ubicacion,
            personas: []
          });
        }

        grupos.get(clave).personas.push(persona);
      });

      grupos.forEach(function (grupo) {
        const u = grupo.ubicacion;
        const personas = grupo.personas;

        const marcador = L.marker([u.lat, u.lng])
          .addTo(mapa);

        const nombres = personas.map(function (persona) {
          return String(persona.nombre || "Nombre no disponible");
        });

        const contenido = document.createElement("div");

        const titulo = document.createElement("strong");
        titulo.textContent = u.etiqueta;
        contenido.appendChild(titulo);

        const total = document.createElement("p");
        total.textContent =
          personas.length + " familiar(es) registrado(s)";
        contenido.appendChild(total);

        const lista = document.createElement("ul");

        nombres.forEach(function (nombre) {
          const elemento = document.createElement("li");
          elemento.textContent = nombre;
          lista.appendChild(elemento);
        });

        contenido.appendChild(lista);

        marcador.bindPopup(contenido);
      });

      console.log(
        "Familiares leídos:",
        familiares.length,
        "| Ubicaciones en el mapa:",
        grupos.size
      );

    } catch (error) {
      console.error("Error al cargar familiares:", error);
      alert(
        "No fue posible cargar familia.json. " +
        "Verifica la ruta del archivo y vuelve a intentarlo."
      );
    }
  }

  // Controles del mapa.
  document.getElementById("verMexico").addEventListener(
    "click",
    function () {
      mapa.setView([23.6345, -102.5528], 5);
    }
  );

  document.getElementById("verMundo").addEventListener(
    "click",
    function () {
      mapa.setView([20, 0], 2);
    }
  );

  document.getElementById("acercar").addEventListener(
    "click",
    function () {
      mapa.zoomIn();
    }
  );

  document.getElementById("alejar").addEventListener(
    "click",
    function () {
      mapa.zoomOut();
    }
  );

  cargarFamiliares();
</script>


</body>
</html>
